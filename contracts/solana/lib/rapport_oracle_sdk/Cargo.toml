[package]
name = "rapport_oracle_sdk"
version = "0.1.0"
description = "Biblioteca para programas consumidores do Rapport Oracle (Solana)"
edition = "2021"

[lib]
crate-type = ["lib"]
name = "rapport_oracle_sdk"

[features]
default = []
cpi = ["dep:rapport_oracle"]
no-entrypoint = []

[dependencies]
anchor-lang = { version = "0.32.1" }
# Consumo direto do repositório, como faria um consumidor externo: o Cargo
# localiza o crate `rapport_oracle` pelo nome em qualquer subdiretório do
# repo. Para reprodutibilidade, pin via `rev`/`tag` em vez de `branch`.
# Para desenvolvimento local, use a alternativa por diretório relativo:
# rapport_oracle = { path = "../../programs/rapport_oracle", features = ["cpi", "no-entrypoint"], optional = true }
rapport_oracle = { git = "https://github.com/RapportTecnologia/rapport_oracle", branch = "main", features = ["cpi", "no-entrypoint"], optional = true }
