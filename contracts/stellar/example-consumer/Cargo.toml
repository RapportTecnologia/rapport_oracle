[package]
name = "example-consumer"
version = "0.1.0"
edition = "2021"
description = "Exemplo de contrato consumidor do Rapport Oracle (Stellar/Soroban)"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }
# Consumo direto do repositório, como faria um consumidor externo: o Cargo
# localiza o crate `rapport-oracle-lib` pelo nome em qualquer subdiretório
# do repo. Para reprodutibilidade, pin via `rev`/`tag` em vez de `branch`.
# Para desenvolvimento local, use a alternativa por diretório relativo:
# rapport-oracle-lib = { path = "../lib/rapport-oracle" }
rapport-oracle-lib = { git = "https://github.com/RapportTecnologia/rapport_oracle", branch = "main" }

[dev_dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
