[package]
name = "rapport-oracle"
version = "0.1.0"
edition = "2021"
description = "Conector on-chain do Rapport Oracle para Stellar (Soroban)"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev_dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
