[profile.default]
src = "contracts/evm"
test = "test/foundry"
out = "foundry-out"
libs = ["node_modules", "lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = []

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 15

[rpc_endpoints]
polygon_amoy = "${POLYGON_AMOY_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
